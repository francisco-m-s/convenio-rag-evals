[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convenio-rag-evals"
version = "0.2.0"
description = "Asistente RAG con citas sobre un convenio colectivo del BOE, con suite de evaluación y trazas de coste"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Las dependencias de ejecución se añaden, fijadas a una versión exacta, en la fase que las usa por primera vez
# (D09 en docs/DECISIONES.md). Fases 1 a 3: embeddings locales, API y cliente HTTP del proveedor de modelos.
dependencies = [
    "fastembed==0.9.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "numpy==2.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
]

[tool.setuptools]
packages = ["convenio_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
